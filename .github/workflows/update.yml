name: Update generated manifests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update manifests
        run: python3 scripts/update.py

      - name: Commit changes
        run: |
          if git diff --quiet -- bucket.json generated; then
            echo "No generated manifest changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket.json generated
          git commit -m "Update generated manifests"
          git push
